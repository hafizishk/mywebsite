<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0F2E">
<title>SPL — Singapore Premier League</title>
<link rel="icon" href="assets/league/spl-lion.png">
<!-- The app on a laptop (Hafiz, 9 Nov, option B): the real app in a phone, an intro, a QR code to open it on a phone,
     the Android download and the admin. index.html sends wide screens here; ?full opens the app full width instead. -->
<style>
@font-face{font-family:Inter;src:url(fonts/inter-latin-400-normal.woff2)}@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Arch;src:url(fonts/archivo-latin-wdth-italic.woff2);font-stretch:62% 125%;font-style:italic;font-weight:100 900}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}html,body{height:100%}
body{font-family:Inter,Arial,sans-serif;color:#F3F2FA;background:radial-gradient(ellipse at 80% 0%,#3A2A78 0%,#1C1A4A 38%,#0B0F2E 72%) fixed;display:flex;align-items:center;justify-content:center;gap:72px;overflow:hidden;padding:24px}
.side{width:420px;display:flex;flex-direction:column;gap:22px}
.side h1{font:italic 800 64px/0.95 Arch,Arial,sans-serif;font-stretch:75%;text-transform:uppercase}
.side p{font-size:17px;line-height:1.5;color:#C9C6E4}
.qr{display:flex;gap:16px;align-items:center}.qr img{width:120px;height:120px;border-radius:12px;background:#fff;padding:6px}.qr span{font-size:14px;color:#C9C6E4;line-height:1.5}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:999px;background:#fff;color:#0B0F2E;font:700 15px Inter,Arial,sans-serif;text-decoration:none}
.btn2{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}.btn:hover{filter:brightness(.92)}
.wrap{flex:none;width:414px;height:868px;transform-origin:center}
.ph{position:relative;width:414px;height:868px;border-radius:62px;padding:12px;background:linear-gradient(145deg,#2b2d3a,#0d0e14);box-shadow:0 0 0 2px #3a3c4a,0 40px 120px rgba(0,0,0,.6),0 0 160px rgba(124,92,255,.25)}
.scr{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#0B0F2E}
.scr iframe{width:390px;height:844px;border:0;display:block}
.sb{position:absolute;left:0;right:0;top:0;height:46px;padding:16px 30px 0 36px;display:flex;justify-content:space-between;font:600 15px Inter,Arial,sans-serif;color:#fff;pointer-events:none;z-index:2;mix-blend-mode:difference}
.sb .ic{display:flex;gap:6px;align-items:center}
.di{position:absolute;top:11px;left:50%;translate:-50%;width:122px;height:35px;border-radius:20px;background:#000;z-index:3;pointer-events:none}
@media (max-width:1000px){.side{display:none}}
</style>
</head>
<body>
<div class="side">
  <img src="assets/league/spl-logo-horizontal-white.png" alt="Singapore Premier League" style="height:56px;align-self:flex-start">
  <h1>The SPL fan app</h1>
  <p>A working demo on the 2026/27 season’s real results. Tap around: it runs here exactly as it does on a phone.</p>
  <div class="qr"><img src="assets/league/qr-app.png" alt="QR code: stackformstudios.com/spl"><span>Best on your phone.<br>Scan to open it there.</span></div>
  <div class="btns"><a class="btn" id="apk" href="spl.apk" download hidden>Download for Android</a><a class="btn btn2" href="admin.html">Open the admin</a></div>
</div>
<div class="wrap" id="wrap"><div class="ph"><div class="scr">
  <iframe id="app" title="The SPL app" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write"></iframe>
  <div class="sb"><b id="clock">9:41</b><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="2"><path d="M1 4.5a10 10 0 0114 0M3.5 7.2a6.4 6.4 0 019 0"/><circle cx="8" cy="10" r="1.2" fill="#fff" stroke="none"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#fff"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".5"/></svg></span></div>
  <div class="di"></div>
</div></div></div>
<script>
// the app, with whatever the link carried (?match=…, ?live, #…), marked as framed so it doesn't send itself here again
(function () {
  var q = location.search.replace(/^\?/, ''), f = document.getElementById('app');
  f.src = 'index.html?inframe' + (q ? '&' + q : '') + location.hash;
  // the phone shrinks to fit a short window
  var w = document.getElementById('wrap');
  function fit() { var k = Math.min(1, (innerHeight - 48) / 868); w.style.transform = 'scale(' + k + ')'; w.style.margin = (868 * (k - 1) / 2) + 'px ' + (414 * (k - 1) / 2) + 'px'; }
  fit(); addEventListener('resize', fit);
  function tick() { var d = new Date(); document.getElementById('clock').textContent = d.getHours() % 12 || 12; document.getElementById('clock').textContent += ':' + String(d.getMinutes()).padStart(2, '0'); }
  tick(); setInterval(tick, 15000);
  // the Android download shows only where the site hosts the APK
  fetch('spl.apk', { method: 'HEAD' }).then(function (r) { if (r.ok) document.getElementById('apk').hidden = false; }).catch(function () {});
})();
</script>
</body>
</html>
